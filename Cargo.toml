[workspace]
members = ["crates/agent-control", "crates/botkit", "crates/fleet", "crates/research-bot"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Nicholas De Raj"]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nickderaj/nswarm"
homepage = "https://github.com/nickderaj/nswarm"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tempfile = { version = "=3.27.0", default-features = false }
thiserror = { version = "=2.0.20", default-features = false, features = ["std"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.test]
debug = 1
