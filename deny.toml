[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
exceptions = [
  # Exact build-tool license used by teloxide-core's pinned graph.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer@0.5.3" },
  # Exact file-level copyleft utility used by dptree; it is not linked into project source.
  { allow = ["MPL-2.0"], crate = "colored@3.1.1" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  # teloxide and jiff still require syn 2 while current rmcp macros use syn 3.
  { crate = "syn@2.0.119", reason = "pinned upstream proc-macro major split" },
  # rustls ring uses the OS-random API retained by its cryptographic backend.
  { crate = "getrandom@0.2.17", reason = "rustls ring backend compatibility" },
  # ring retains the older Windows API crate while Tokio uses the current one.
  { crate = "windows-sys@0.52.0", reason = "rustls ring backend compatibility" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
