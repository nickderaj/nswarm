name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: rustup show
      - run: cargo install cargo-nextest --version 0.9.128 --locked
      - run: cargo install cargo-hack --version 0.6.45 --locked
      - run: python3 scripts/policy_check.py
      - run: python3 scripts/validate_profiles.py
      - run: python3 scripts/run_evals.py
      - run: ./scripts/check_generated.sh
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - run: cargo hack check --workspace --feature-powerset --depth 2

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-vet --version 0.10.2 --locked
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo install cargo-semver-checks --version 0.46.0 --locked
      - run: cargo deny check
      - run: cargo vet check
      - run: cargo machete
      - name: Semver compatibility
        run: |
          if git cat-file -e origin/main:Cargo.toml 2>/dev/null; then
            cargo semver-checks check-release --workspace --baseline-rev origin/main
          else
            echo "Initial public API baseline will be established by this merge"
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo install cargo-nextest --version 0.9.128 --locked
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo llvm-cov --fail-under-lines 90 --lcov --output-path lcov.info nextest --workspace --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo check --workspace --all-targets --all-features

  current-stable:
    name: current-stable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup update stable --no-self-update
      - run: cargo +stable check --workspace --all-targets --all-features

  aarch64-compile:
    name: aarch64-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo check --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu
