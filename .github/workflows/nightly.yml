name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: project-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      project: ${{ steps.project.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Workflow-only bootstrap is active; no project exists on main yet."
          fi

  fuzz:
    name: fuzz
    needs: preflight
    if: ${{ needs.preflight.outputs.project == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2025-09-18 --profile minimal
      - run: cargo +nightly-2025-09-18 install cargo-fuzz --version 0.13.2 --locked
      - working-directory: fuzz
        run: cargo +nightly-2025-09-18 fuzz run manifest -- -max_total_time=900
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-fuzz-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: expanded-mutation
    needs: preflight
    if: ${{ needs.preflight.outputs.project == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-mutation-${{ github.run_id }}
          path: mutants.out
          if-no-files-found: error
          retention-days: 14

  feature-powerset:
    name: expanded-features
    needs: preflight
    if: ${{ needs.preflight.outputs.project == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo install cargo-hack --version 0.6.45 --locked
      - run: cargo hack check --workspace --feature-powerset
