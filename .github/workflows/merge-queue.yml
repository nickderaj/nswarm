name: Merge queue

on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2025-09-18 --profile minimal --component rust-src
      - run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly-2025-09-18 test --workspace --target x86_64-unknown-linux-gnu
      - run: RUSTFLAGS="-Zsanitizer=leak" cargo +nightly-2025-09-18 test --workspace --target x86_64-unknown-linux-gnu

  miri:
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2025-09-18 --profile minimal --component miri
      - run: cargo +nightly-2025-09-18 miri test --workspace

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace --in-place

  aarch64:
    name: aarch64
    runs-on: [self-hosted, Linux, ARM64, nswarm-pi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo test --workspace --all-features
